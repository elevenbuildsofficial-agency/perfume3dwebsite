<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Morrow cinematic verification</title><style>html,body{margin:0;background:#151c18;color:#f3efdf;font:13px system-ui}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:8px;border-radius:6px;cursor:pointer}label{display:flex;gap:8px;align-items:center}input{width:70px}iframe{display:block;border:0;margin:0 auto;background:#efeadd}output{padding:10px}</style></head><body><header><label>Width <input id="width" type="number" value="390"></label><label>Height <input id="height" type="number" value="844"></label><button id="resize">Apply size</button><button data-scroll="0">Idle / reverse to 0%</button><button data-scroll=".03">3%</button><button data-scroll=".12">12% / cap lifted</button><button data-scroll=".16">16% / focus</button><button data-scroll=".22">22% / neck</button><button data-scroll=".30">30% / First Light</button><button data-scroll="2">Velvet Hour</button><button data-scroll="3">Wild Ground</button><button data-scroll="4">All three</button><button id="reduced">Reduced motion</button><output id="status"></output></header><iframe id="site" title="Morrow website preview" src="/"></iframe><script>
const frame=document.getElementById('site'),width=document.getElementById('width'),height=document.getElementById('height'),status=document.getElementById('status');
const query=new URLSearchParams(location.search);width.value=query.get('width')||390;height.value=query.get('height')||844;
function resize(){frame.style.width=width.value+'px';frame.style.height=height.value+'px';}
resize();document.getElementById('resize').onclick=resize;
document.querySelectorAll('[data-scroll]').forEach(button=>button.onclick=()=>{frame.contentWindow.scrollTo({top:Number(button.dataset.scroll)*frame.contentWindow.innerHeight,behavior:'instant'});status.textContent=button.textContent;});
document.getElementById('reduced').onclick=()=>{frame.src='/?motion=reduce';status.textContent='Reduced motion';};
</script></body></html>
