<!doctype html><html><head><meta charset="utf-8"><title>Morrow film audit</title><style>body{margin:0;font:14px system-ui;background:#202820;color:#fff}header{padding:8px;display:flex;gap:8px}button{padding:8px}iframe{display:block;border:0;margin:0 auto}</style></head><body><header><span>Hero progress</span><button data-to="0">0%</button><button data-to=".1">10%</button><button data-to=".2">20%</button><button data-to=".35">35%</button><button data-to=".5">50%</button><button data-to=".65">65%</button><button data-to="2">Velvet</button><button data-to="3">Wild</button><button data-to="4">Final</button><output id="status">Loading</output></header><iframe title="Film preview" id="site" src="/"></iframe><script>
const f=document.getElementById('site'),q=new URLSearchParams(location.search);f.style.width=(q.get('width')||390)+'px';f.style.height=(q.get('height')||844)+'px';let serial=0;
document.querySelectorAll('[data-to]').forEach(button=>button.onclick=()=>{const target=Number(button.dataset.to);f.contentWindow.scrollTo({top:target*f.contentWindow.innerHeight,behavior:'instant'});const current=++serial;status.textContent='Rendering';const check=()=>{if(current!==serial)return;const c=f.contentDocument.querySelector('canvas');if(c?.dataset.ready==='true'&&Math.abs(Number(c.dataset.scroll)-target)<.002){document.getElementById('status').textContent='Ready '+button.textContent;}else requestAnimationFrame(check);};requestAnimationFrame(check);});
</script></body></html>
