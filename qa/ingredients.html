<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Morrow ingredient QA</title><style>body{margin:0;background:#ddd;font:12px system-ui}header{padding:8px;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px}iframe{display:block;border:0;margin:auto}</style></head><body><header><button data-anchor="chapter-0">Hero</button><button data-anchor="chapter-3">Wild Ground scene</button><button data-note="0">Citrus scene</button><button data-note="1">Rose scene</button><button data-note="2">Tea scene</button><button data-note="3">Fig scene</button><button data-anchor="chapter-4">Final collection</button></header><iframe title="Ingredient preview"></iframe><script>
const q=new URLSearchParams(location.search),f=document.querySelector('iframe');f.width=q.get('width')||1440;f.height=q.get('height')||900;f.src=q.has('reduced')?'/?motion=reduce':'/';
document.querySelectorAll('button').forEach(button=>button.onclick=()=>{const w=f.contentWindow,d=f.contentDocument;let top;if(button.dataset.anchor)top=d.getElementById(button.dataset.anchor).offsetTop;else{const s=d.getElementById('ingredients');top=s.offsetTop+(s.offsetHeight-w.innerHeight)*Number(button.dataset.note)/3;}w.scrollTo({top,behavior:'instant'});});
</script></body></html>
