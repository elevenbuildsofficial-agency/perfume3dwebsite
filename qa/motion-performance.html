<!doctype html><html><head><meta charset="utf-8"><title>Morrow scroll performance</title><style>body{margin:0;background:#ddd;font:12px system-ui}header{padding:10px;display:flex;gap:10px;align-items:center}button{padding:10px}iframe{display:block;border:0;margin:auto}output{white-space:pre-wrap}</style></head><body><header><button data-case="hero" disabled>Benchmark hero</button><button data-case="ingredients" disabled>Benchmark ingredients</button><button data-case="day" disabled>Benchmark rituals</button><button data-case="about" disabled>Benchmark About</button><output>Loading…</output></header><iframe title="Morrow performance preview"></iframe><script>
const params=new URLSearchParams(location.search),frame=document.querySelector('iframe'),out=document.querySelector('output'),buttons=[...document.querySelectorAll('button')];frame.width=params.get('width')||1440;frame.height=params.get('height')||900;frame.src=params.has('about')?'/about/':'/';
frame.onload=()=>{buttons.forEach(b=>b.disabled=false);out.textContent='Ready';};
buttons.forEach(button=>button.onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument,h=w.innerHeight;let a=0,b=h*.76;const section=d.getElementById(button.dataset.case==='ingredients'?'ingredients':'day');if(button.dataset.case==='about')b=d.querySelector('main').offsetHeight-h;else if(button.dataset.case!=='hero'){a=section.offsetTop;b=a+section.offsetHeight-h*.7;}buttons.forEach(b=>b.disabled=true);w.scrollTo({top:a,behavior:'instant'});out.textContent='Warming assets…';setTimeout(()=>{const frames=[],tasks=[];let previous=0,start=0;const observer=new w.PerformanceObserver(list=>tasks.push(...list.getEntries().map(e=>e.duration)));try{observer.observe({entryTypes:['longtask']});}catch{}function tick(time){if(!start)start=time;if(previous)frames.push(time-previous);previous=time;const p=Math.min(1,(time-start)/6000);w.scrollTo({top:a+(b-a)*p,behavior:'instant'});if(p<1){w.requestAnimationFrame(tick);return;}observer.disconnect();const sorted=frames.slice().sort((a,b)=>a-b),q=n=>Math.round(sorted[Math.floor((sorted.length-1)*n)]*100)/100;const result={scene:button.dataset.case,width:w.innerWidth,height:w.innerHeight,samples:frames.length,fps:Math.round(1000/(frames.reduce((a,b)=>a+b,0)/frames.length)*10)/10,p50ms:q(.5),p95ms:q(.95),framesOver33ms:frames.filter(v=>v>33.5).length,longTasks:tasks.length,longTaskMs:Math.round(tasks.reduce((a,b)=>a+b,0))};out.textContent=JSON.stringify(result);out.dataset.result=JSON.stringify(result);buttons.forEach(b=>b.disabled=false);}w.requestAnimationFrame(tick);},1000);});
</script></body></html>
