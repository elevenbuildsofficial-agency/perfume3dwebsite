<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Morrow pages QA</title><style>body{margin:0;background:#ddd;font:12px system-ui}header{padding:8px;display:flex;gap:7px;flex-wrap:wrap}button{padding:8px}iframe{display:block;border:0;margin:0 auto}</style></head><body><header></header><iframe title="Morrow page preview"></iframe><script>
const q=new URLSearchParams(location.search),page=q.get('page')||'home',f=document.querySelector('iframe'),bar=document.querySelector('header');f.width=q.get('width')||1440;f.height=q.get('height')||900;f.src=(page==='contact'?'/contact/':page==='finder'?'/find-your-morrow/':page==='about'?'/about/':'/')+(q.has('reduced')?'?motion=reduce':'');
const controls=page==='home'?[['Hero','chapter-0'],['Hero 40px','hero-scroll'],['First Light','chapter-1'],['First to Velvet','scent-between',1.5],['Velvet Hour','chapter-2'],['Wild Ground','chapter-3'],['Ingredients','ingredients',0],['Citrus to rose','ingredients',.7],['Rose','ingredients',1],['Tea','ingredients',2],['Fig','ingredients',3],['Fig to gallery 25%','gallery-entry',.25],['Fig to gallery 50%','gallery-entry',.5],['Fig to gallery 75%','gallery-entry',.75],['Gallery First','gallery',0],['Gallery Velvet','gallery',1],['Gallery Wild','gallery',2],['Morning','day',0],['Morning to Evening','day',.7],['Evening','day',1],['Evening to Outside','day',1.7],['Outside','day',2],['Return start','return',0],['Return half','return',.5],['Return end','return',1],['Collection','chapter-4']]:page==='about'?[['Origins',0],['Feeling',1],['Nature',2],['Form',3],['You',4],['Nature to Form',2.5]]:page==='contact'?[['Hello',0],['Contact halfway',.7],['Contact form',1]]:[['Intro',0],['Question 1',1],['Question 2',2],['Question 3',3],['Result',4]];
controls.forEach(([label,target,index])=>{const button=document.createElement('button');button.textContent=label;button.onclick=()=>{const d=f.contentDocument,w=f.contentWindow;let top;if(target==='hero-scroll')top=40;else if(target==='scent-between')top=index*w.innerHeight;else if(page==='home'){const section=d.getElementById(target==='return'?'day':target==='gallery-entry'?'gallery':target);top=section.offsetTop;if(target==='gallery-entry')top-=w.innerHeight*(.65-.55*index);if(target==='ingredients')top+=(section.offsetHeight-w.innerHeight)*index/3;if(target==='gallery')top+=(section.offsetHeight-w.innerHeight)*index/2;if(target==='day')top+=(section.offsetHeight-w.innerHeight*1.8)*index/2;if(target==='return')top+=section.offsetHeight-w.innerHeight*1.2+w.innerHeight*1.1*index;}else{if(page==='about'){const film=d.querySelector('[data-reduced]');top=(film.offsetHeight-w.innerHeight)*target/4;}else{const main=d.querySelector('main'),view=main.firstElementChild;top=main.offsetTop+(main.offsetHeight-view.clientHeight)*target/(page==='finder'?4:1);}}w.scrollTo({top,behavior:'instant'});};bar.append(button);});
</script></body></html>
