<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Morrow pages QA</title><style>body{margin:0;background:#ddd;font:12px system-ui}header{padding:8px;display:flex;gap:7px;flex-wrap:wrap}button{padding:8px}iframe{display:block;border:0;margin:0 auto}</style></head><body><header></header><iframe title="Morrow page preview"></iframe><script>
const q=new URLSearchParams(location.search),page=q.get('page')||'home',f=document.querySelector('iframe'),bar=document.querySelector('header');f.width=q.get('width')||1440;f.height=q.get('height')||900;f.src=(page==='contact'?'/contact/':page==='finder'?'/find-your-morrow/':'/')+(q.has('reduced')?'?motion=reduce':'');
const controls=page==='home'?[['Hero','chapter-0'],['Hero 40px','hero-scroll'],['Ingredients','ingredients'],['Morning','day',0],['Morning to Evening','day',.7],['Evening','day',1],['Evening to Outside','day',1.7],['Outside','day',2],['Collection','chapter-4']]:page==='contact'?[['Hello',0],['Contact form',1]]:[['Intro',0],['Question 1',1],['Question 2',2],['Question 3',3],['Result',4]];
controls.forEach(([label,target,index])=>{const button=document.createElement('button');button.textContent=label;button.onclick=()=>{const d=f.contentDocument,w=f.contentWindow;let top;if(target==='hero-scroll')top=40;else if(page==='home'){const section=d.getElementById(target);top=section.offsetTop;if(target==='day')top+=(section.offsetHeight-w.innerHeight)*index/2;}else{const main=d.querySelector('main'),view=main.firstElementChild;top=main.offsetTop+(main.offsetHeight-view.clientHeight)*target/(page==='finder'?4:1);}w.scrollTo({top,behavior:'instant'});};bar.append(button);});
</script></body></html>
