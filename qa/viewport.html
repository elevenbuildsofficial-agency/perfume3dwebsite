<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morrow responsive QA</title><style>html,body{margin:0;min-height:100%;background:#e8e8e8}body{display:flex;justify-content:center;align-items:flex-start;width:max-content;min-width:100%}iframe{border:0;display:block;flex-shrink:0;background:#dce643}</style></head>
<body><script>
const params=new URLSearchParams(location.search);
const width=Math.max(360,Math.min(1920,Number(params.get('width'))||390));
const height=Math.max(650,Math.min(1200,Number(params.get('height'))||844));
const frame=document.createElement('iframe');frame.title='Morrow responsive preview';frame.width=String(width);frame.height=String(height);
const pageParams=new URLSearchParams();if(params.has('fallback'))pageParams.set('fallback','1');if(params.has('reduced'))pageParams.set('motion','reduce');
const base=params.has('production')?'http://127.0.0.1:4173/':'../';
const page=params.get('page')==='about'?'about/':'';
frame.src=base+page+'?'+pageParams.toString();document.body.append(frame);
</script></body></html>
